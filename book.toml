[book]
title = "GitYourShtuff"
description = "User manual for the GitYourShtuff dotfiles template"
src = "docs"
language = "en"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/rmayobre/gityourshtuff"
edit-url-template = "https://github.com/rmayobre/gityourshtuff/edit/docs/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 20
